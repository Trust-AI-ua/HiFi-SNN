dataset: toniot
neuron: LeakyParallel
encoding: latency
hidden_size: 128
num_steps: 25
batch_size: 128
epochs: 10
lr: 0.001
seed: 42
# TON-IoT (Network) recognized multiclass benchmark is the 10-class `type`
# (Moustafa, Sustainable Cities and Society 2021; UNSW ToN_IoT). No coarser attack-family
# grouping exists, so label_mode=full == the 10-class type. 80/20 stratified split.
label_mode: full
results_dir: results/toniot/SNN_LeakyParallel/latency
summary_csv: results/summary.csv
