dataset: ciciomt2024
neuron: LeakyParallel
encoding: latency
hidden_size: 128
num_steps: 25
batch_size: 128
epochs: 10
lr: 0.001
seed: 42
# CICIoMT2024 train is ~7.16M rows; 0.25 -> ~1.8M (CIC-IDS2017 scale) to keep it
# tractable. Subsamples both train and test. Set to 1.0 for the full split.
subsample_fraction: 0.25
results_dir: results/ciciomt2024/SNN_LeakyParallel/latency
summary_csv: results/summary.csv
