dataset: ciciot2023
neuron: LeakyParallel
encoding: latency
hidden_size: 128
num_steps: 25
batch_size: 128
epochs: 10
lr: 0.001
seed: 42
# CICIoT2023 is ~46.69M rows; 0.05 -> ~2.3M (CIC-IDS2017 scale) to keep it tractable.
# Stratified split, so the heavy class imbalance is preserved. Set to 1.0 for full.
subsample_fraction: 0.05
results_dir: results/ciciot2023/SNN_LeakyParallel/latency
summary_csv: results/summary.csv
