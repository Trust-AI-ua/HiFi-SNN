dataset: edgeiiot
neuron: LeakyParallel
encoding: latency
hidden_size: 128
num_steps: 25
batch_size: 128
epochs: 10
lr: 0.001
seed: 42
# Edge-IIoTset's recognized multiclass benchmark is the 15-class Attack_type
# (Ferrag et al., IEEE Access 2022, DOI 10.1109/ACCESS.2022.3165809, and the authors'
# official Colab recipe, which classifies on `Attack_type`). 80/20 split (loader default
# test_fraction=0.2); features via the authors' drop-15-columns + dummy-encode recipe.
label_mode: full
results_dir: results/edgeiiot/SNN_LeakyParallel/latency
summary_csv: results/summary.csv
