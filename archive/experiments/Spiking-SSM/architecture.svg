<svg viewBox="0 0 470 720" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Spiking-SSM (Design A) architecture</title><desc>Spike-encoded traffic sequence -> spiking front-end -> stacked selective spiking state-space blocks (input-dependent A/B/C, spike-triggered scan, LIF membrane memory) -> anomaly head -> energy-aware early exit -> decision.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="470" height="720" fill="#1a1a18"/>
<rect x="85" y="20" width="300" height="52" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="235.0" y="39.0" text-anchor="middle" fill="#d3d1c7" font-size="13" font-weight="600">Network traffic sequence</text>
<text x="235.0" y="57.0" text-anchor="middle" fill="#b4b2a9" font-size="11">packets · flows · windows</text>
<line x1="235" y1="72" x2="235" y2="90" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="90" width="300" height="52" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="235.0" y="109.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Latency / delta encoding</text>
<text x="235.0" y="127.0" text-anchor="middle" fill="#5dcaa5" font-size="11">event-driven, protocol-aware</text>
<line x1="235" y1="142" x2="235" y2="160" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="160" width="300" height="52" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="235.0" y="179.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Spiking front-end</text>
<text x="235.0" y="197.0" text-anchor="middle" fill="#5dcaa5" font-size="11">adaptive LIF / LeakyParallel</text>
<line x1="235" y1="212" x2="235" y2="236" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="236" width="330" height="212" rx="12" fill="#262624" stroke="#888780" stroke-width="0.6" stroke-dasharray="5 4"/>
<text x="86" y="256" fill="#faf9f5" font-size="13" font-weight="600">Spiking state-space block · ×N stacked · residual</text>
<rect x="110" y="268" width="250" height="44" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="1"/>
<text x="235.0" y="283.0" text-anchor="middle" fill="#cecbf6" font-size="13" font-weight="600">Selective state update</text>
<text x="235.0" y="301.0" text-anchor="middle" fill="#afa9ec" font-size="11">input-dependent A, B, C</text>
<line x1="235" y1="312" x2="235" y2="326" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="110" y="326" width="250" height="44" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="1"/>
<text x="235.0" y="341.0" text-anchor="middle" fill="#cecbf6" font-size="13" font-weight="600">Spike-triggered recurrence</text>
<text x="235.0" y="359.0" text-anchor="middle" fill="#afa9ec" font-size="11">event-driven scan</text>
<line x1="235" y1="370" x2="235" y2="384" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="110" y="384" width="250" height="44" rx="8" fill="#3c3489" stroke="#afa9ec" stroke-width="1"/>
<text x="235.0" y="399.0" text-anchor="middle" fill="#cecbf6" font-size="13" font-weight="600">LIF membrane memory</text>
<text x="235.0" y="417.0" text-anchor="middle" fill="#afa9ec" font-size="11">linear-time, long-range</text>
<line x1="235" y1="448" x2="235" y2="470" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="470" width="300" height="52" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="235.0" y="489.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Anomaly head</text>
<text x="235.0" y="507.0" text-anchor="middle" fill="#5dcaa5" font-size="11">classifier or predictor</text>
<line x1="385" y1="496" x2="410" y2="496" stroke="#9c9a92" stroke-width="0.6" stroke-dasharray="4 3"/>
<line x1="235" y1="522" x2="235" y2="540" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="540" width="300" height="52" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="235.0" y="559.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Energy-aware early exit</text>
<text x="235.0" y="577.0" text-anchor="middle" fill="#5dcaa5" font-size="11">confidence-triggered</text>
<line x1="235" y1="592" x2="235" y2="610" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="610" width="300" height="52" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="235.0" y="629.0" text-anchor="middle" fill="#d3d1c7" font-size="13" font-weight="600">Decision</text>
<text x="235.0" y="647.0" text-anchor="middle" fill="#b4b2a9" font-size="11">benign / attack / uncertain</text>
<rect x="40" y="690" width="12" height="12" rx="3" fill="#3c3489" stroke="#afa9ec" stroke-width="1"/>
<text x="58" y="700" fill="#c2c0b6" font-size="11">spiking state-space core</text>
<rect x="268" y="690" width="12" height="12" rx="3" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="286" y="700" fill="#c2c0b6" font-size="11">spiking components</text>
<rect x="448" y="690" width="12" height="12" rx="3" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="466" y="700" fill="#c2c0b6" font-size="11">I/O</text>
</svg>
