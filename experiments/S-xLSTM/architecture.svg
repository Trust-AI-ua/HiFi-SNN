<svg viewBox="0 0 660 580" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>S-xLSTM (revised Design A, LRAM) architecture</title><desc>Windowed traffic -> per-modality encoders (optionally ICL support) -> latency spike encoding -> stacked mLSTM selective linear recurrence + LeakyParallel spiking readout (dual parallel-train / recurrent-infer) -> readout + early exit. Pink = LRAM design extensions, not in the current implementation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="660" height="580" fill="#1a1a18"/>
<rect x="210" y="30" width="260" height="54" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="340.0" y="50.0" text-anchor="middle" fill="#d3d1c7" font-size="13" font-weight="600">Network traffic</text>
<text x="340.0" y="68.0" text-anchor="middle" fill="#b4b2a9" font-size="11">train short → infer long</text>
<line x1="340" y1="84" x2="340" y2="110" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="110" width="150" height="54" rx="8" fill="#72243e" stroke="#ed93b1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="105" y="131" text-anchor="middle" fill="#f4c0d1" font-size="13" font-weight="600">ICL support</text>
<text x="105" y="149" text-anchor="middle" fill="#ed93b1" font-size="11">adapt, no retrain</text>
<line x1="180" y1="137" x2="208" y2="137" stroke="#993556" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="210" y="110" width="260" height="54" rx="8" fill="#72243e" stroke="#ed93b1" stroke-width="1"/>
<text x="340.0" y="130.0" text-anchor="middle" fill="#f4c0d1" font-size="13" font-weight="600">Per-modality encoders</text>
<text x="340.0" y="148.0" text-anchor="middle" fill="#ed93b1" font-size="11">shared across datasets</text>
<line x1="340" y1="164" x2="340" y2="190" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210" y="190" width="260" height="54" rx="8" fill="#712b13" stroke="#f0997b" stroke-width="1"/>
<text x="340.0" y="210.0" text-anchor="middle" fill="#f5c4b3" font-size="13" font-weight="600">Latency encoding</text>
<text x="340.0" y="228.0" text-anchor="middle" fill="#f0997b" font-size="11">TTFS → sparse spikes</text>
<line x1="340" y1="244" x2="340" y2="270" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="170" y="270" width="340" height="170" rx="12" fill="#262624" stroke="#888780" stroke-width="0.6" stroke-dasharray="5 4"/>
<text x="186" y="290" fill="#faf9f5" font-size="13" font-weight="600">mLSTM block · ×N</text>
<rect x="200" y="306" width="280" height="48" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="340.0" y="323.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Selective linear recurrence</text>
<text x="340.0" y="341.0" text-anchor="middle" fill="#5dcaa5" font-size="11">input-dependent gates</text>
<line x1="340" y1="354" x2="340" y2="368" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="368" width="280" height="48" rx="8" fill="#712b13" stroke="#f0997b" stroke-width="1"/>
<text x="340.0" y="385.0" text-anchor="middle" fill="#f5c4b3" font-size="13" font-weight="600">Spiking readout</text>
<text x="340.0" y="403.0" text-anchor="middle" fill="#f0997b" font-size="11">LeakyParallel · no reset</text>
<line x1="510" y1="392" x2="522" y2="392" stroke="#9c9a92" stroke-width="0.6" stroke-dasharray="4 3"/>
<rect x="522" y="366" width="118" height="48" rx="8" fill="#72243e" stroke="#ed93b1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="581" y="386" text-anchor="middle" fill="#f4c0d1" font-size="13" font-weight="600">Dual mode</text>
<text x="581" y="403" text-anchor="middle" fill="#ed93b1" font-size="11">parallel train · recurrent infer</text>
<line x1="340" y1="440" x2="340" y2="466" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210" y="466" width="260" height="54" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="340.0" y="486.0" text-anchor="middle" fill="#d3d1c7" font-size="13" font-weight="600">Readout + early-exit</text>
<text x="340.0" y="504.0" text-anchor="middle" fill="#b4b2a9" font-size="11">accumulate spikes, decide</text>
<rect x="40" y="548" width="12" height="12" rx="3" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="58" y="558" fill="#c2c0b6" font-size="11">structural</text>
<rect x="156" y="548" width="12" height="12" rx="3" fill="#712b13" stroke="#f0997b" stroke-width="1"/>
<text x="174" y="558" fill="#c2c0b6" font-size="11">spiking</text>
<rect x="248" y="548" width="12" height="12" rx="3" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="266" y="558" fill="#c2c0b6" font-size="11">mLSTM</text>
<rect x="324" y="548" width="12" height="12" rx="3" fill="#72243e" stroke="#ed93b1" stroke-width="1"/>
<text x="342" y="558" fill="#c2c0b6" font-size="11">LRAM addition (design / future)</text>
</svg>
