# Spiking-Griffin (hybrid: gated linear recurrence + windowed spike attention)
# Dataset: nslkdd
# Backbone interleaves, per layer: [RG-LRU recurrence -> LeakyParallel readout]
# then [windowed spike-driven local attention -> LeakyParallel readout].
# Only LeakyParallel (neuron) + latency (encoding) are used, per design.
dataset: nslkdd

# --- architecture ---
num_steps: 25        # latency window T (also the recurrence/attention length)
d_model: 64
num_layers: 1        # each layer = 1 recurrence sub-block + 1 attention sub-block
window: 4            # local-attention radius: attend where |i - j| <= window
beta: 0.9            # LeakyParallel initial membrane decay (learned)

# --- training ---
batch_size: 128
epochs: 10
lr: 0.001
weight_decay: 0.0001
class_weighted: false   # off by default -> comparable to the SNN ablation and S-xLSTM
val_fraction: 0.1
seed: 42

# --- inference ---
early_exit_conf: 0.9

# --- output (results stored separately from SNN and S-xLSTM) ---
results_dir: results/Spiking-Griffin/nslkdd
summary_csv: results/summary_griffin.csv
