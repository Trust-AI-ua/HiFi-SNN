<svg viewBox="0 0 470 922" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Tree-to-Spike (Design C) architecture</title><desc>Two-phase pipeline. Training: flow features -> GBDT teacher + tree-guided spike encoder -> compact SNN student (CE+KD+rank+sparsity+FP). Deployment: fixed encoder + quantized SNN with early exit, no tree at runtime.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="470" height="922" fill="#1a1a18"/>
<rect x="45" y="24" width="380" height="360" rx="14" fill="none" stroke="#888780" stroke-width="0.6" stroke-dasharray="6 5"/>
<text x="61" y="46" fill="#faf9f5" font-size="13" font-weight="600">Training phase</text>
<rect x="85" y="56" width="300" height="52" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="235.0" y="75.0" text-anchor="middle" fill="#d3d1c7" font-size="13" font-weight="600">Network flow features</text>
<text x="235.0" y="93.0" text-anchor="middle" fill="#b4b2a9" font-size="11">NetFlow / CICFlowMeter</text>
<line x1="235" y1="108" x2="235" y2="128" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="128" width="300" height="52" rx="8" fill="#633806" stroke="#ef9f27" stroke-width="1"/>
<text x="235.0" y="147.0" text-anchor="middle" fill="#fac775" font-size="13" font-weight="600">GBDT teacher</text>
<text x="235.0" y="165.0" text-anchor="middle" fill="#ef9f27" font-size="11">XGBoost / LightGBM · train only</text>
<line x1="235" y1="180" x2="235" y2="200" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="200" width="300" height="52" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="235.0" y="219.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Tree-guided spike encoder</text>
<text x="235.0" y="237.0" text-anchor="middle" fill="#5dcaa5" font-size="11">split-bins · TTFS · budget</text>
<line x1="235" y1="252" x2="235" y2="272" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="272" width="300" height="52" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="235.0" y="291.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Compact SNN student</text>
<text x="235.0" y="309.0" text-anchor="middle" fill="#5dcaa5" font-size="11">sparse LIF layers</text>
<line x1="385" y1="298" x2="405" y2="298" stroke="#9c9a92" stroke-width="0.6" stroke-dasharray="4 3"/>
<line x1="235" y1="324" x2="235" y2="344" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="344" width="300" height="30" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="235.0" y="360.0" text-anchor="middle" dominant-baseline="middle" fill="#d3d1c7" font-size="13" font-weight="600">Deploy to edge: encoder + quantized SNN, no tree</text>
<text x="412" y="292" fill="#b4b2a9" font-size="10.5">objective:</text>
<text x="412" y="306" fill="#b4b2a9" font-size="10.5">CE+KD+rank</text>
<text x="412" y="320" fill="#b4b2a9" font-size="10.5">+sparsity+FP</text>
<line x1="235" y1="384" x2="235" y2="404" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45" y="404" width="380" height="470" rx="14" fill="none" stroke="#888780" stroke-width="0.6" stroke-dasharray="6 5"/>
<text x="61" y="426" fill="#faf9f5" font-size="13" font-weight="600">Deployment phase — SNN only</text>
<rect x="85" y="436" width="300" height="52" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="235.0" y="455.0" text-anchor="middle" fill="#d3d1c7" font-size="13" font-weight="600">Incoming flow</text>
<text x="235.0" y="473.0" text-anchor="middle" fill="#b4b2a9" font-size="11">live NetFlow</text>
<line x1="235" y1="488" x2="235" y2="506" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="506" width="300" height="52" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="235.0" y="525.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Tree-guided encoder — fixed</text>
<text x="235.0" y="543.0" text-anchor="middle" fill="#5dcaa5" font-size="11">thresholds baked in</text>
<line x1="235" y1="558" x2="235" y2="578" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="105" y="578" width="260" height="180" rx="12" fill="#262624" stroke="#888780" stroke-width="0.6" stroke-dasharray="5 4"/>
<text x="121" y="598" fill="#faf9f5" font-size="13" font-weight="600">Compact SNN · quantized</text>
<rect x="120" y="606" width="230" height="40" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="235" y="619.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Spiking LIF layers</text>
<text x="235" y="637.0" text-anchor="middle" fill="#5dcaa5" font-size="11">LeakyParallel / IF</text>
<line x1="235" y1="646" x2="235" y2="658" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="120" y="658" width="230" height="40" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="235" y="671.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Spike-count readout</text>
<text x="235" y="689.0" text-anchor="middle" fill="#5dcaa5" font-size="11">+ membrane potential</text>
<line x1="235" y1="698" x2="235" y2="712" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="120" y="712" width="230" height="40" rx="8" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="235" y="725.0" text-anchor="middle" fill="#9fe1cb" font-size="13" font-weight="600">Energy-aware early exit</text>
<text x="235" y="743.0" text-anchor="middle" fill="#5dcaa5" font-size="11">confidence-triggered</text>
<line x1="235" y1="786" x2="235" y2="806" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="85" y="806" width="300" height="52" rx="8" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="235.0" y="825.0" text-anchor="middle" fill="#d3d1c7" font-size="13" font-weight="600">Decision</text>
<text x="235.0" y="843.0" text-anchor="middle" fill="#b4b2a9" font-size="11">benign / attack / uncertain</text>
<rect x="40" y="892" width="12" height="12" rx="3" fill="#085041" stroke="#5dcaa5" stroke-width="1"/>
<text x="58" y="902" fill="#c2c0b6" font-size="11">spiking / SNN</text>
<rect x="180" y="892" width="12" height="12" rx="3" fill="#633806" stroke="#ef9f27" stroke-width="1"/>
<text x="198" y="902" fill="#c2c0b6" font-size="11">teacher (training only)</text>
<rect x="400" y="892" width="12" height="12" rx="3" fill="#444441" stroke="#b4b2a9" stroke-width="1"/>
<text x="418" y="902" fill="#c2c0b6" font-size="11">I/O &amp; generic</text>
</svg>
